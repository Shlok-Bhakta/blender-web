<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blender</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#252525;color:#ddd;font:14px system-ui}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%;height:100dvh;outline:none;touch-action:none}
#status{position:fixed;inset:0;display:grid;place-content:center;gap:12px;background:#252525;pointer-events:none;padding:24px;text-align:center}
progress{width:min(280px,75vw);height:6px;accent-color:#e99546}
#detail{font-size:12px;color:#aaa;min-height:1.5em}
</style>
<canvas id="canvas" tabindex="0" aria-label="Blender application"></canvas>
<div id="status" role="status"><span id="message">Loading Blender…</span><progress id="progress" aria-label="Blender download progress" max="1"></progress><span id="detail"></span></div>
<script src="boot.js"></script>
</html>
