# Original portable OpenSSL code, 32-bit Wasm limbs and Emscripten pthreads.
my %targets = (
    "blender-web-wasm32" => {
        inherit_from  => [ "BASE_unix" ],
        CC            => "emcc",
        CXX           => "em++",
        AR            => "emar",
        RANLIB        => "emranlib",
        bn_ops        => "BN_LLONG RC4_CHAR",
        thread_scheme => "pthreads",
        ex_libs       => "-pthread",
    },
);
