name: Blender Web native UI

on:
  push:
    branches: [main, blender-web/v5.2]
    paths: ['web/**', 'intern/ghost/**', 'blender', '.gitmodules', '.github/workflows/web-pages.yml', '!web/docs/**', '!web/native/*.md', '!web/README.md']
  pull_request:
    paths: ['web/**', 'intern/ghost/**', 'blender', '.gitmodules', '.github/workflows/web-pages.yml', '!web/docs/**', '!web/native/*.md', '!web/README.md']
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/tests/package-lock.json
      - name: Read pinned SDK
        run: |
          python3 - <<'PY'
          import json, os
          pins = json.load(open('web/upstream.json'))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"EMSDK_REVISION={pins['emsdkRevision']}\n")
              output.write(f"EMSDK_VERSION={pins['emscriptenVersion']}\n")
          PY
      - uses: actions/cache@v4
        id: sdk-cache
        with:
          path: ${{ runner.temp }}/emsdk
          key: ${{ runner.os }}-emsdk-${{ hashFiles('web/upstream.json') }}
      - name: Install Emscripten
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" fetch --depth=1 https://github.com/emscripten-core/emsdk.git "$EMSDK_REVISION"
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
      - uses: actions/cache/restore@v4
        id: native-deps
        with:
          path: |
            build/native/deps/prefix
            build/native/deps/downloads
            build/native/deps/*/installed.json
          key: ${{ runner.os }}-native-deps-${{ hashFiles('web/upstream.json', 'web/tools/native_deps.py', 'web/tools/native_media.py', 'web/tools/native_text.py', 'web/tools/native_usd.py', 'web/tools/native_oidn.py', 'web/tools/native_ispc.py', 'web/tools/native_ispc_half.py', 'web/native/ispc-host.json', 'web/native/oidn/**', 'web/tools/native_app_deps.py', 'web/tools/native_python.py', 'web/native/openssl-wasm.conf', 'web/native/shader-deps/**', 'web/native/toolchain.cmake', 'web/native/patches/**') }}
          restore-keys: ${{ runner.os }}-native-deps-
      - uses: actions/cache/restore@v4
        id: app-deps
        with:
          path: |
            build/native/deps/prefix/share/blender-web/licenses/numpy
            build/native/deps/prefix/include/blender-web-numpy.hh
            build/native/deps/prefix/lib/blender-web-numpy
            build/native/deps/prefix/lib/blender-web-python
            build/native/deps/prefix/include/blender-web-python.hh
            build/native/deps/prefix/include/blender-web-python-bindings.hh
            build/native/deps/prefix/lib/blender-web-bindings
            build/native/deps/python-bindings/installed.json
            build/native/deps/prefix/share/blender-web/licenses/pybind11
            build/native/deps/prefix/share/blender-web/licenses/nanobind
            build/native/deps/prefix/share/blender-web/licenses/materialx/render
            build/native/deps/python-extensions/installed.json
            build/native/deps/python-packages/installed.json
            build/native/deps/numpy/installed.json
            build/native/deps/prefix/include/python3.13
            build/native/deps/prefix/lib/python3.13
            build/native/deps/prefix/lib/libpython3.13.a
            build/native/deps/prefix/include/shaderc
            build/native/deps/prefix/lib/libshaderc_combined.a
            build/native/gpu-deps
          key: ${{ runner.os }}-native-app-deps-v2-${{ hashFiles('web/upstream.json', 'web/native/shader-deps/**', 'web/tools/native_app_deps.py', 'web/tools/native_numpy.py', 'web/tools/native_python.py', 'web/tools/native_python_packages.py', 'web/tools/native_bindings.py', 'web/native/python-bindings/**', 'web/native/patches/yamlcpp.patch', 'web/native/python-packages.json', 'web/native/ghost/GHOST_WebNetwork.*', 'web/native/ghost/GHOST_WebDownload.py', 'web/native/patches/urllib3.patch', 'web/tools/native_deps.py', 'web/native/toolchain.cmake', 'web/native/numpy-static.patch') }}
          restore-keys: ${{ runner.os }}-native-app-deps-v2-
      - name: Build and validate native dependencies
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          mkdir -p build/native
          python3 web/tests/dependency_download.py
          python3 web/tools/native_build.py --jobs 4 --configure-only --check-deps 2>&1 | tee build/native/dependencies-build.log
      - uses: actions/cache/save@v4
        if: steps.native-deps.outputs.cache-hit != 'true'
        with:
          path: |
            build/native/deps/prefix
            build/native/deps/downloads
            build/native/deps/*/installed.json
          key: ${{ steps.native-deps.outputs.cache-primary-key }}
      - name: Build and validate application dependencies
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          mkdir -p build/native
          python3 web/tools/native_build.py --app --jobs 4 --configure-only --check-deps 2>&1 | tee build/native/dependencies-build.log
      - uses: actions/cache/save@v4
        if: steps.app-deps.outputs.cache-hit != 'true'
        with:
          path: |
            build/native/deps/prefix/share/blender-web/licenses/numpy
            build/native/deps/prefix/include/blender-web-numpy.hh
            build/native/deps/prefix/lib/blender-web-numpy
            build/native/deps/prefix/lib/blender-web-python
            build/native/deps/prefix/include/blender-web-python.hh
            build/native/deps/prefix/include/blender-web-python-bindings.hh
            build/native/deps/prefix/lib/blender-web-bindings
            build/native/deps/python-bindings/installed.json
            build/native/deps/prefix/share/blender-web/licenses/pybind11
            build/native/deps/prefix/share/blender-web/licenses/nanobind
            build/native/deps/prefix/share/blender-web/licenses/materialx/render
            build/native/deps/python-extensions/installed.json
            build/native/deps/python-packages/installed.json
            build/native/deps/numpy/installed.json
            build/native/deps/prefix/include/python3.13
            build/native/deps/prefix/lib/python3.13
            build/native/deps/prefix/lib/libpython3.13.a
            build/native/deps/prefix/include/shaderc
            build/native/deps/prefix/lib/libshaderc_combined.a
            build/native/gpu-deps
          key: ${{ steps.app-deps.outputs.cache-primary-key }}
      - name: Compile original Blender application
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          python3 web/tools/native_build.py --app --skip-deps --jobs 4 2>&1 | tee build/native/build.log
      - name: Install browser tests
        working-directory: web/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test without server isolation headers
        run: |
          python3 web/tools/serve.py --directory build/native/dist --pages-mode > "$RUNNER_TEMP/blender-web-server.log" 2>&1 &
          WEB_SERVER_PID=$!
          trap 'kill "$WEB_SERVER_PID"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/manifest.json > /dev/null; then break; fi
            sleep 1
          done
          node web/tests/cache.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ node web/tests/loading.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ WEB_TEST_UI_FALLBACK=1 node web/tests/loading.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ node web/tests/python-bindings.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ WEB_TEST_UI_FALLBACK=1 node web/tests/python-bindings.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ node web/tests/python-foundation.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ WEB_TEST_UI_FALLBACK=1 node web/tests/python-foundation.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ node web/tests/render-libraries.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ WEB_TEST_UI_FALLBACK=1 node web/tests/render-libraries.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ node web/tests/embree.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ WEB_TEST_UI_FALLBACK=1 node web/tests/embree.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ node web/tests/text.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ WEB_TEST_UI_FALLBACK=1 node web/tests/text.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ node web/tests/gltf.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ WEB_TEST_UI_FALLBACK=1 node web/tests/gltf.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ node web/tests/tracking.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ WEB_TEST_UI_FALLBACK=1 node web/tests/tracking.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ node web/tests/native.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ WEB_TEST_UI_FALLBACK=1 node web/tests/native.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ node web/tests/features.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ WEB_TEST_UI_FALLBACK=1 node web/tests/features.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ node web/tests/ocean-alembic.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ WEB_TEST_UI_FALLBACK=1 node web/tests/ocean-alembic.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ node web/tests/volume.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ WEB_TEST_UI_FALLBACK=1 node web/tests/volume.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ node web/tests/image-vector.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ WEB_TEST_UI_FALLBACK=1 node web/tests/image-vector.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ WEB_RENDER_SOFTWARE=1 node web/tests/freestyle.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ node web/tests/usd-exchange.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ WEB_TEST_UI_FALLBACK=1 node web/tests/usd-exchange.cjs
          WEB_TEST_URL=http://127.0.0.1:8080/ WEB_RENDER_SOFTWARE=1 node web/tests/cycles.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            build/native/loading-evidence
            build/native/loading-evidence-ui
            build/native/render-libraries-evidence*
            build/native/python-foundation-evidence*
            build/native/python-bindings-evidence*
            build/native/python-bindings-check.json
            build/native/hevc-check-*.hevc
            build/native/embree-evidence*
            build/native/cache-evidence
            build/native/evidence
            build/native/evidence-ui
            build/native/feature-evidence
            build/native/feature-evidence-ui
            build/native/cycles-evidence
            build/native/ocean-evidence*
            build/native/volume-evidence*
            build/native/image-vector-evidence*
            build/native/freestyle-evidence*
            build/native/usd-evidence*
            build/native/text-evidence*
            build/native/gltf-evidence*
            build/native/tracking-evidence*
            build/native/build.log
            build/native/*-check.json
            build/native/*-build.log
            build/native/deps/*/build.log
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/native/dist

  # Pages publication is owned by publish-validated.yml. A later source rebuild
  # must not replace the exact archive that passed the release verification gate.
